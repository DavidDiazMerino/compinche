name: Check Compinche

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.lock.txt
      - name: Check browser modules
        run: npm run check
      - name: Test persistence, guardrails, API and SAM boundaries
        run: python -m pytest backend/tests -q
        # Tests use isolated temporary storage and fake external providers.
        # No API keys, model downloads, GPU jobs or user recordings are used.
